variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_VERIFY: "0"
    DOCKER_CERT_PATH: ""
    DOCKER_API_VERSION: "1.39"
    DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
    DOCKERFILE_PATH: Dockerfile
    DOCKER_BUILDKIT: 1

default:
  tags:
    - kubernetes
  image: alpine:latest

stages:
    - version
    - test
    - build
    - deploy
version:
    stage: version
    script:
        - echo "Version: $CI_COMMIT_REF_NAME"
